<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Movie Tracker AI</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Movie Tracker AI</a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="admin-dashboard.html">Admin</a>
      <span id="auth-links"></span>
    </div>
  </nav>

  <main>
    <h1 class="mb-4">Admin Dashboard</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="stat-users">0</div>
        <div class="label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="number" id="stat-movies">0</div>
        <div class="label">Total Movies</div>
      </div>
      <div class="stat-card">
        <div class="number" id="stat-watched">0</div>
        <div class="label">Movies Watched</div>
      </div>
      <div class="stat-card">
        <div class="number" id="stat-announcements">0</div>
        <div class="label">Announcements</div>
      </div>
    </div>

    <div class="card mb-4">
      <h2>Users</h2>
      <table class="table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </div>

    <div class="card mb-4">
      <h2>Post Announcement</h2>
      <form id="announcement-form">
        <div class="form-group">
          <label for="announcement-title">Title</label>
          <input type="text" id="announcement-title" required placeholder="Announcement title" />
        </div>
        <div class="form-group">
          <label for="announcement-content">Content</label>
          <textarea id="announcement-content" required placeholder="Announcement content..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Post Announcement</button>
      </form>
    </div>

    <div class="card">
      <h2>Recent Announcements</h2>
      <div id="announcements-container"></div>
      <div class="mt-3">
        <a href="checkpoints.html" class="btn btn-secondary">View Project Checkpoints</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p> Movie Tracker AI. All rights reserved.</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/movies.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/ai.js"></script>
</body>
</html>
