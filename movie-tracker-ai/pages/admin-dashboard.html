<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - MovieTracker AI</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <nav class="navbar">
    <a href="home.html">Home</a>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
    <a href="profile.html">Profile</a>
    <a href="extended-profile.html">Extended Profile</a>
    <a href="watchlist.html">Watchlist</a>
    <a href="add-movie.html">Add Movie</a>
    <a href="ai-recommendations.html">AI Recommendations</a>
    <a href="admin-dashboard.html">Admin</a>
    <a href="checkpoints.html">Checkpoints</a>
  </nav>

  <main>
    <h1>Admin Dashboard</h1>

    <section>
      <h2>👤 Users</h2>
      <div id="usersList"></div>
    </section>

    <hr>

    <section>
      <h2>🎬 Movies (Editable)</h2>
      <div id="moviesList"></div>
    </section>
  </main>

  <script>
    function loadAdminData() {
      const users = JSON.parse(localStorage.getItem("users")) || [];
      const movies = JSON.parse(localStorage.getItem("movies")) || [];

      const usersContainer = document.getElementById("usersList");
      const moviesContainer = document.getElementById("moviesList");

      usersContainer.innerHTML = "";
      moviesContainer.innerHTML = "";

      // USERS
      users.forEach(user => {
        const div = document.createElement("div");

        div.innerHTML = `
          <p><strong>Name:</strong> ${user.name}</p>
          <p><strong>Email:</strong> ${user.email}</p>
          <hr>
        `;

        usersContainer.appendChild(div);
      });

      // MOVIES (EDITABLE)
      movies.forEach(movie => {
        const div = document.createElement("div");

        div.innerHTML = `
          <input type="text" id="title-${movie.id}" value="${movie.title}" />
          <input type="text" id="genre-${movie.id}" value="${movie.genre}" />
          <input type="number" id="rating-${movie.id}" value="${movie.rating}" min="0" max="5" />

          <button onclick="updateMovie('${movie.id}')">Update</button>

          <p><strong>User ID:</strong> ${movie.userId}</p>
          <hr>
        `;

        moviesContainer.appendChild(div);
      });
    }

    function updateMovie(id) {
      let movies = JSON.parse(localStorage.getItem("movies")) || [];

      const updatedMovies = movies.map(movie => {
        if (movie.id === id) {
          return {
            ...movie,
            title: document.getElementById(`title-${id}`).value,
            genre: document.getElementById(`genre-${id}`).value,
            rating: Number(document.getElementById(`rating-${id}`).value)
          };
        }
        return movie;
      });

      localStorage.setItem("movies", JSON.stringify(updatedMovies));

      alert("Movie updated successfully!");

      loadAdminData();
    }

    loadAdminData();
  </script>

</body>
</html>
