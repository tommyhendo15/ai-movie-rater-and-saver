<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Movie - Movie Tracker AI</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Movie Tracker AI</a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="watchlist.html">Watchlist</a>
      <span id="auth-links"></span>
    </div>
  </nav>

  <main>
    <div class="card" style="max-width: 600px; margin: 2rem auto;">
      <h2 class="text-center mb-4">Add a Movie</h2>
      <form id="add-movie-form">
        <div class="form-group">
          <label for="movie-title">Title</label>
          <input type="text" id="movie-title" required placeholder="Movie title" />
        </div>
        <div class="form-group">
          <label for="movie-year">Year</label>
          <input type="number" id="movie-year" required placeholder="Release year" />
        </div>
        <div class="form-group">
          <label for="movie-genre">Genre</label>
          <select id="movie-genre" required>
            <option value="">Select genre</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
            <option value="Thriller">Thriller</option>
            <option value="Crime">Crime</option>
            <option value="Documentary">Documentary</option>
            <option value="Animation">Animation</option>
          </select>
        </div>
        <div class="form-group">
          <label for="movie-director">Director</label>
          <input type="text" id="movie-director" required placeholder="Director name" />
        </div>
        <div class="form-group">
          <label for="movie-rating">Rating (0-10)</label>
          <input type="number" id="movie-rating" min="0" max="10" step="0.1" placeholder="Your rating" />
        </div>
        <div class="form-group">
          <label for="movie-status">Status</label>
          <select id="movie-status" required>
            <option value="pending">Pending</option>
            <option value="watched">Watched</option>
            <option value="dropped">Dropped</option>
          </select>
        </div>
        <div class="form-group">
          <label for="movie-review">Review</label>
          <textarea id="movie-review" placeholder="Write a short review..."></textarea>
        </div>
        <div class="form-group">
          <label for="movie-poster">Poster URL</label>
          <input type="url" id="movie-poster" placeholder="https://example.com/poster.jpg" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Add Movie</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p> Movie Tracker AI. All rights reserved.</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/movies.js"></script>
</body>
</html>
