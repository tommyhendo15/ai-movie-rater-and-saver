<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extended Profile - Movie Tracker AI</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Movie Tracker AI</a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="profile.html">Profile</a>
      <span id="auth-links"></span>
    </div>
  </nav>

  <main>
    <div class="card" style="max-width: 600px; margin: 2rem auto;">
      <h2 class="text-center mb-4">Edit Extended Profile</h2>
      <form id="extended-profile-form">
        <div class="form-group">
          <label for="ep-bio">Bio</label>
          <textarea id="ep-bio" placeholder="Tell us about yourself..."></textarea>
        </div>
        <div class="form-group">
          <label for="ep-location">Location</label>
          <input type="text" id="ep-location" placeholder="City, Country" />
        </div>
        <div class="form-group">
          <label for="ep-birthdate">Birth Date</label>
          <input type="date" id="ep-birthdate" />
        </div>
        <div class="form-group">
          <label for="ep-favgenres">Favorite Genres (comma-separated)</label>
          <input type="text" id="ep-favgenres" placeholder="Sci-Fi, Drama, Action..." />
        </div>
        <div class="form-group">
          <label for="ep-twitter">Twitter</label>
          <input type="text" id="ep-twitter" placeholder="@username" />
        </div>
        <div class="form-group">
          <label for="ep-instagram">Instagram</label>
          <input type="text" id="ep-instagram" placeholder="@username" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Profile</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p> Movie Tracker AI. All rights reserved.</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
