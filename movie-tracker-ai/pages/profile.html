<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Movie Tracker AI</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Movie Tracker AI</a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="ai-recommendations.html">AI Recommendations</a>
      <span id="auth-links"></span>
    </div>
  </nav>

  <main>
    <div class="card" style="max-width: 600px; margin: 2rem auto;">
      <h2 class="text-center mb-4">Your Profile</h2>
      <div class="mb-3">
        <strong>Username:</strong> <span id="profile-username"></span>
      </div>
      <div class="mb-3">
        <strong>Email:</strong> <span id="profile-email"></span>
      </div>
      <div class="mb-3">
        <strong>Role:</strong> <span id="profile-role"></span>
      </div>
      <div class="mb-3">
        <strong>Joined:</strong> <span id="profile-joined"></span>
      </div>
      <div class="mb-4">
        <strong>Bio:</strong>
        <p id="profile-bio" class="mt-1"></p>
      </div>
      <div class="text-center">
        <a href="extended-profile.html" class="btn btn-primary">Edit Extended Profile</a>
        <a href="watchlist.html" class="btn btn-secondary">My Watchlist</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p> Movie Tracker AI. All rights reserved.</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/movies.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/ai.js"></script>
</body>
</html>
