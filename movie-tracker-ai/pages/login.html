<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Movie Tracker AI</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Movie Tracker AI</a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <span id="auth-links"></span>
    </div>
  </nav>

  <main>
    <div class="card" style="max-width: 480px; margin: 2rem auto;">
      <h2 class="text-center mb-4">Welcome Back</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
      </form>
      <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </main>

  <footer class="footer">
    <p> Movie Tracker AI. All rights reserved.</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
