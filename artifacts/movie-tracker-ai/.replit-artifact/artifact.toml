kind = "web"
previewPath = "/"
title = "Movie Tracker AI"
version = "1.0.0"
id = "artifacts/movie-tracker-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8080

[services.development]
run = "cd /home/runner/workspace/movie-tracker-ai && node server.js"

[services.production]
build = [ "cd", "/home/runner/workspace/movie-tracker-ai", "&&", "node", "server.js" ]
publicDir = "movie-tracker-ai"
serve = "static"

[services.env]
PORT = "8080"
